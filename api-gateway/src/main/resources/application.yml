server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: PT30M
      default-filters:
        - name: Retry
          args:
            retries: 1
            methods: GET
      routes:

        # --- Auth publique : pas de vérification JWT ici (elle N'EXISTE PAS ENCORE) ---
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userOrIpKeyResolver}"

        # --- user-service (routes protégées : profil, gestion compte) ---
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userOrIpKeyResolver}"

        # --- space-service ---
        - id: space-service
          uri: ${SPACE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/spaces/**, /api/v1/groupes/**
          filters:
            - name: JwtAuthentication

        # --- ingestion-service ---
        - id: ingestion-service
          uri: ${INGESTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/documents/**
          filters:
            - name: JwtAuthentication

        # --- chat-service ---
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/conversations/**, /api/v1/messages/**
          filters:
            - name: JwtAuthentication

        # --- fiche-service ---
        - id: fiche-service
          uri: ${FICHE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/fiches/**, /api/v1/annotations/**, /api/v1/validations/**
          filters:
            - name: JwtAuthentication

        # --- analytics-service ---
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/dashboard/**, /api/v1/recommandations/**
          filters:
            - name: JwtAuthentication

        # --- gamification-service ---
        - id: gamification-service
          uri: ${GAMIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/objectifs/**, /api/v1/badges/**, /api/v1/rappels/**
          filters:
            - name: JwtAuthentication

security:
  jwt:
    secret: ${JWT_SECRET:changeme-dev-secret-please-override-in-env-file-min-32-chars}

f:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    mg.esmia.miage.gateway: DEBUG
