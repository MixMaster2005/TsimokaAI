# TsimokaAI — configuration nginx du frontend (SPA + proxy API).
#
# Deux responsabilités, rien de plus :
#   1. Servir le bundle Vite avec fallback SPA : toute URL inconnue renvoie
#      index.html (le routeur TanStack prend le relais côté client) — sinon
#      un refresh sur /espaces/xyz donne un 404 nginx.
#   2. Proxifier /api vers l'api-gateway : le navigateur reste sur la même
#      origine (zéro CORS), et la gateway reste le seul point d'entrée où
#      le JWT est vérifié — cohérent avec le contrat backend.
#
# Pas de cache agressif : les assets hashés par Vite portent leur empreinte
# dans le nom de fichier ; index.html ne doit JAMAIS être mis en cache
# longtemps sinon une nouvelle version du front n'est jamais vue.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Proxy API -> api-gateway (réseau Docker interne) -------------------
    # Le corps des requêtes peut être gros (upload de documents en multipart).
    client_max_body_size 25m;

    location /api/ {
        # Résolution DYNAMIQUE (resolver Docker embarqué 127.0.0.11) : nginx
        # démarre même si api-gateway est momentanément absent/récréé (sinon il
        # refuse de boot sur "host not found in upstream"), et re-résout le nom
        # à chaque requête (valid 10s) — absorbe les recréations de conteneur.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_gateway_upstream http://api-gateway:8080;
        proxy_pass $api_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La génération de fiche / le chat LLM peuvent dépasser le timeout par défaut (60s).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Assets statiques fingerprintés -------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Fallback SPA --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html jamais caché longtemps (voir commentaire en tête).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
