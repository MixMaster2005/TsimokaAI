server:
  port: ${SERVER_PORT:8082}

spring:
  autoconfigure:
    # Auto-configs OpenAI du starter exclues :
    #   - openAiApi exige une clé non vide au boot et créerait un 2e EmbeddingModel
    #     alors que QdrantVectorStoreAutoConfiguration n'en accepte qu'un ;
    #   - les clients Groq/Gemini sont construits en lazy par
    #     LlmProviderAutoConfiguration (clé absente = provider indisponible).
    # L'embedding de retrieval reste celui d'Ollama, aligné sur ingestion-service.
    exclude:
      # TOUTE l'auto-config OpenAI du starter : les clients Groq/Gemini sont construits
      # en lazy par LlmProviderAutoConfiguration (clé absente = provider indisponible,
      # jamais un crash au boot), et le starter créerait sinon chat/embedding/audio/
      # moderation/image en exigeant tous une clé dès le démarrage.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
  application:
    name: space-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/space_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    retry:
      # Échec rapide : la résilience LLM est gérée par le circuit breaker llm-*
      # (fallback métier), pas par des retries HTTP transparents qui dépassent
      # le timeout de la gateway.
      max-attempts: 1
    openai:
      # Groq expose une API compatible OpenAI (bascule "groq" du contrat de configuration).
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      api-key: ${GROQ_API_KEY:}
      chat:
        options:
          model: ${GROQ_MODEL:openai/gpt-oss-120b}
    # Gemini via l'endpoint officiel compatible OpenAI (consommé par le bean local d'ai-common,
    # namespace dédié pour ne pas écraser l'auto-config Groq).
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      api-key: ${GEMINI_API_KEY:}
      chat:
        options:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:3b}
      embedding:
        # Même modèle d'embedding qu'ingestion-service (espace vectoriel commun pour le
        # retrieval Qdrant de l'échantillon de chunks).
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      qdrant:
        # Collection UNIQUE partagée "chunks" (Option A multi-tenant) : l'échantillon de
        # chunks du persona est lu avec un filtre space_id/document_id en payload.
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        use-tls: ${QDRANT_USE_TLS:false}
        collection-name: ${QDRANT_COLLECTION:chunks}

# Génération / enrichissement du persona par LLM (provider actif + circuit breaker).
chat:
  llm:
    active-provider: ${ACTIVE_LLM_PROVIDER:ollama}

persona:
  sample-size: ${PERSONA_SAMPLE_SIZE:8}

resilience4j:
  circuitbreaker:
    instances:
      llm-persona:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    mg.esmia.miage.spaceservice: DEBUG
