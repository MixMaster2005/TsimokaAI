server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ingestion-service

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ingestion_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:documents}

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  use-tls: ${QDRANT_USE_TLS:false}

# docling-worker : conteneur d'extraction spawné à la demande par ingestion-service
# (docker-java). Image construite manuellement : docker build -t docling-worker:latest ./docling-worker
# Spec v2 : la clé Gemini (vision, OpenAI-compatible) est injectée au conteneur au runtime.
docling-worker:
  docker-host: ${DOCKER_HOST_SOCKET:unix:///var/run/docker.sock}
  image: ${DOCLING_WORKER_IMAGE:docling-worker:latest}
  network: ${DOCKER_NETWORK:apa-net}
  container-port: 8090
  startup-timeout-seconds: ${DOCLING_WORKER_STARTUP_TIMEOUT:30}
  conversion-timeout-seconds: ${DOCLING_WORKER_CONVERT_TIMEOUT:300}
  gemini-api-key: ${GEMINI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    mg.esmia.miage.ingestionservice: DEBUG
