version: "3.9"

# ============================================================================
# TsimokaAI — orchestration locale complète.
#
# Choix dictés par les contraintes matérielles du mémoire (Intel i5-6200U, 8 Go RAM,
# pas de GPU) :
#   - UNE seule instance PostgreSQL héberge toutes les bases (voir infra/postgres-init),
#     au lieu d'un conteneur par service, pour limiter l'empreinte mémoire.
#   - Chaque JVM Spring Boot est bridée via -XX:MaxRAMPercentage + mem_limit.
#   - Ollama (LLM local, fallback hors-ligne) est dans le profil "ollama" et ne démarre
#     pas par défaut : `docker compose --profile ollama up` pour l'inclure.
#
# Démarrage standard :  docker compose up --build
# Avec Ollama          :  docker compose --profile ollama up --build
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: tsimoka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Port HÔTE décalé à 5433 pour ne pas rentrer en conflit avec un PostgreSQL
      # déjà installé sur la machine de dev. À l'intérieur du réseau Compose, les
      # services continuent d'utiliser jdbc:postgresql://postgres:5432/... tel quel.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 350m

  redis:
    image: redis:7-alpine
    container_name: tsimoka-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 100m

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: tsimoka-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC (utilisé par le client Java)
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 350m

  minio:
    image: minio/minio:latest
    container_name: tsimoka-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 200m

  # Optionnel — profil "ollama" uniquement (fallback LLM 100% local/hors-ligne).
  # Les services y accèdent par le réseau interne (http://ollama:11434) : la
  # publication hôte est décalée à 11435 pour ne JAMAIS entrer en conflit avec un
  # éventuel ollama installé sur la machine de dev.
  ollama:
    image: ollama/ollama:latest
    container_name: tsimoka-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11435:11434"
    mem_limit: 2500m

  # --------------------------------------------------------------------------
  # Microservices applicatifs
  # --------------------------------------------------------------------------

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: tsimoka-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8081
      SPACE_SERVICE_URL: http://space-service:8082
      INGESTION_SERVICE_URL: http://ingestion-service:8083
      CHAT_SERVICE_URL: http://chat-service:8084
      FICHE_SERVICE_URL: http://fiche-service:8085
      ANALYTICS_SERVICE_URL: http://analytics-service:8086
      GAMIFICATION_SERVICE_URL: http://gamification-service:8087
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 400m

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: tsimoka-user-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 400m

  space-service:
    build:
      context: .
      dockerfile: space-service/Dockerfile
    container_name: tsimoka-space-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/space_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Persona LLM : mêmes variables IA que chat/fiche (génération + enrichissement)
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
      ACTIVE_LLM_PROVIDER: ${ACTIVE_LLM_PROVIDER:-ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 400m

  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    container_name: tsimoka-ingestion-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/ingestion_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
      OLLAMA_URL: http://ollama:11434
      # docling-worker (conteneur d'extraction spawné à la demande) : même réseau Docker
      # que ingestion-service pour que le DNS par nom de conteneur fonctionne.
      DOCLING_WORKER_IMAGE: ${DOCLING_WORKER_IMAGE:-docling-worker:latest}
      DOCKER_NETWORK: apa-net
      # Spec v2 : clé Gemini (vision) transmise au worker via docker-java à chaque spawn.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # ThreadPoolTaskExecutor : file bornée pour limiter les workers Docker concurrents
      INGESTION_CORE_POOL_SIZE: ${INGESTION_CORE_POOL_SIZE:-2}
      INGESTION_MAX_POOL_SIZE: ${INGESTION_MAX_POOL_SIZE:-4}
      INGESTION_QUEUE_CAPACITY: ${INGESTION_QUEUE_CAPACITY:-10}
    volumes:
      # ⚠️ SECURITE : monter le socket Docker de l'hôte équivaut à un accès ROOT sur l'hôte
      # (ingestion-service peut piloter tous les conteneurs). Acceptable en local/démo ;
      # en environnement partagé, cloisonner via un proxy type `docker-socket-proxy` et
      # pointer DOCKER_HOST_SOCKET dessus.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    mem_limit: 450m

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    container_name: tsimoka-chat-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/chat_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
      SPACE_SERVICE_URL: http://space-service:8082
      INGESTION_SERVICE_URL: http://ingestion-service:8083
      ACTIVE_LLM_PROVIDER: ${ACTIVE_LLM_PROVIDER:-ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    mem_limit: 400m

  fiche-service:
    build:
      context: .
      dockerfile: fiche-service/Dockerfile
    container_name: tsimoka-fiche-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/fiche_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Génération Map-Reduce : lecture Qdrant + LLM (map/reduce), comme chat-service
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
      ACTIVE_LLM_PROVIDER: ${ACTIVE_LLM_PROVIDER:-ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 400m

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: tsimoka-analytics-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 350m

  gamification-service:
    build:
      context: .
      dockerfile: gamification-service/Dockerfile
    container_name: tsimoka-gamification-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/gamification_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 350m

  # --------------------------------------------------------------------------
  # Frontend (SPA React/Vite servie par nginx)
  # nginx proxifie /api vers api-gateway : le navigateur reste sur la même
  # origine (http://localhost:3000), aucun CORS en jeu. VITE_API_BASE_URL est
  # vide au build -> requêtes relatives (cf. frontend/Dockerfile + nginx.conf).
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tsimoka-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    mem_limit: 64m

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  ollama_data:

# ----------------------------------------------------------------------------
# Réseau nommé explicitement : le conteneur docling-worker spawné dynamiquement
# par ingestion-service (docker-java, `HostConfig.withNetworkMode("apa-net")`)
# doit rejoindre le réseau par un nom FIXE (pas le nom auto-généré par Compose)
# pour que la résolution DNS `docling-worker-<uuid>` fonctionne.
# ----------------------------------------------------------------------------
networks:
  default:
    name: apa-net
