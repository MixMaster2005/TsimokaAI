server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: chat-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chat_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    openai:
      # Groq expose une API compatible OpenAI : on pointe simplement le starter
      # OpenAI de Spring AI sur son base-url (bascule "groq" du contrat).
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      api-key: ${GROQ_API_KEY:}
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    # Gemini expose aussi une API compatible OpenAI (endpoint officiel Google,
    # https://generativelanguage.googleapis.com/v1beta/openai/). Le starter OpenAI ne
    # permettant qu'UNE auto-configuration (déjà prise par Groq), on fournit ici un
    # namespace dédié consommé par un bean OpenAiChatModel manuel (variable locale, pas
    # de bean OpenAiApi/OpenAiChatModel pour ne pas supprimer l'auto-config Groq).
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      api-key: ${GEMINI_API_KEY:}
      chat:
        options:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:3b}
      embedding:
        # Même modèle d'embedding qu'ingestion-service (les vecteurs indexés doivent être
        # dans le même espace pour que le retrieval fonctionne).
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      qdrant:
        # Collection UNIQUE partagée (Option A multi-tenant) : chaque point porte son
        # space_id en payload, filtré au retrieval (RagPipelineAdvisor).
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        use-tls: ${QDRANT_USE_TLS:false}
        collection-name: ${QDRANT_COLLECTION:chunks}

# Appel REST service-à-service vers space-service pour récupérer le persona de l'espace
# (headers X-User-Id injectés par la gateway reproduits en interne, cf. SpaceClient).
space-service:
  url: ${SPACE_SERVICE_URL:http://localhost:8082}

# Appel REST service-à-service vers ingestion-service pour résoudre les noms de documents
# des citations RAG (même contrat de headers internes, cf. IngestionClient).
ingestion-service:
  url: ${INGESTION_SERVICE_URL:http://localhost:8083}

chat:
  llm:
    # Bascule selon l'environnement (contrat de configuration) : groq | gemini | ollama
    active-provider: ${ACTIVE_LLM_PROVIDER:ollama}
  # Pipeline RAG (RagPipelineAdvisor) : retrieval large + rerank + contexte
  retrieval:
    top-k: ${CHAT_RETRIEVAL_TOP_K:40}
    similarity-threshold: ${CHAT_RETRIEVAL_SIMILARITY_THRESHOLD:0.5}
  max-retrieved-chunks: ${CHAT_MAX_RETRIEVED_CHUNKS:5}
  max-history-messages: ${CHAT_MAX_HISTORY_MESSAGES:10}

# Résilience : circuit breaker autour de l'appel RAG+LLM (ChatLlmService).
resilience4j:
  circuitbreaker:
    instances:
      llm-chat:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    mg.esmia.miage.chatservice: DEBUG
